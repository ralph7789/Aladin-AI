      ## 5. Governing Law


      These Terms shall be governed by and construed in accordance with the laws
      of the United States, without giving effect to any principles of conflicts
      of law.


      ## 6. Changes to the Terms


      We reserve the right to modify these Terms at any time. We will notify
      users of any changes by email. Your continued use of the Website after
      such changes have been notified will constitute your consent to such
      changes.


      ## 7. Contact Information


      If you have any questions about these Terms, please contact us at
      contact@aladin.ai.


      By using the Website, you acknowledge that you have read these Terms of
      Service and agree to be bound by them.
  endpointsMenu: false
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents: true
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: false
  fileCitations: true
registration:
  socialLogins:
    - github
    - google
    - discord
    - openid
    - facebook
    - apple
    - saml
  speech:
    stt:
      huggingface:
        apiKey: ${HUGGINGFACE_API_KEY}
        model: openai/whisper-large-v3
actions:
  allowedDomains:
    - swapi.dev
    - aladin.ai
    - google.com
endpoints:
  openAI:
    titleModel: current_model
    models:
      default:
        - openAI
      fetch: true
