version: 1.2.1
cache: true
interface:
  customWelcome: Welcome to Aladin! With the love of Aladin❤️‍🔥️.
  fileSearch: true
  privacyPolicy:
    externalUrl: https://aladin.ai/privacy-policy
    openNewTab: true
  termsOfService:
    externalUrl: https://aladin.ai/tos
    openNewTab: true
    modalAcceptance: true
    modalTitle: Terms of Service for Aladin
    modalContent: >
      # Terms and Conditions for Aladin


      *Effective Date: February 18, 2024*


      Welcome to Aladin, the informational website for the open-source AI chat
      platform, available at https://aladin.ai. These Terms of Service ("Terms")
