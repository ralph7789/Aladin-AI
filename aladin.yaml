      using the Website, you agree to be bound by these Terms and our Privacy
      Policy, accessible at https://aladin.ai//privacy.


      ## 1. Ownership


      Upon purchasing a package from Aladin, you are granted the right to
      download and use the code for accessing an admin panel for Aladin. While
      you own the downloaded code, you are expressly prohibited from reselling,
      redistributing, or otherwise transferring the code to third parties
      without explicit permission from Aladin.


      ## 2. User Data


      We collect personal data, such as your name, email address, and payment
      information, as described in our Privacy Policy. This information is
      collected to provide and improve our services, process transactions, and
      communicate with you.


      ## 3. Non-Personal Data Collection


      The Website uses cookies to enhance user experience, analyze site usage,
      and facilitate certain functionalities. By using the Website, you consent
      to the use of cookies in accordance with our Privacy Policy.


      ## 4. Use of the Website


      You agree to use the Website only for lawful purposes and in a manner that
      does not infringe the rights of, restrict, or inhibit anyone else's use
      and enjoyment of the Website. Prohibited behavior includes harassing or
      causing distress or inconvenience to any person, transmitting obscene or
      offensive content, or disrupting the normal flow of dialogue within the
