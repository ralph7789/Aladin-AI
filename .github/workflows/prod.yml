name: Prod Build and Push

on:
  push:
    branches:
      - main
      - prod

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/ralph7789/aladin-api:latest
          cache-from: type=registry,ref=ghcr.io/ralph7789/aladin-api:prod-buildcache
          cache-to: type=registry,ref=ghcr.io/ralph7789/aladin-api:prod-buildcache,mode=max

      - name: Build and Push RAG API
        uses: docker/build-push-action@v5
        with:
          context: ./aladin-rag-api
          file: ./aladin-rag-api/Dockerfile
          push: true
          tags: ghcr.io/ralph7789/aladin-rag-api:latest
          cache-from: type=registry,ref=ghcr.io/ralph7789/aladin-rag-api:prod-buildcache
          cache-to: type=registry,ref=ghcr.io/ralph7789/aladin-rag-api:prod-buildcache,mode=max
