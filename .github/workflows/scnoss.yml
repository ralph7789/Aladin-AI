name: Clean Room Snippet Scanner

on: 
  push:
    branches: [ "experimental-features" ]
  pull_request:
    branches: [ "experimental-features" ]
  workflow_dispatch: 

# These permissions allow the action to post comments on PRs and upload checks
permissions:
  contents: write
  pull-requests: write
  checks: write
  actions: read

jobs:
  audit-codebase:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out your repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Run the SCANOSS snippet scanner
      - name: Run SCANOSS Code Scan
        uses: scanoss/gha-code-scan@v1
