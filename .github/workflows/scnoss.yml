name: Clean Room Local Scanner

on: 
  push:
    branches: [ "experimental-features" ]
  pull_request:
    branches: [ "experimental-features" ]
  workflow_dispatch: 

jobs:
  audit-codebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ScanCode Toolkit
        run: pip install scancode-toolkit

      - name: Run Local Offline Scan
        # This scans for copyrights (-c), licenses (-l), packages (-p), emails (-e), and infos (-i)
        # It ignores standard dependency folders to speed up the scan
        run: |
          scancode -clpei --json-pp clean-room-report.json --ignore "node_modules" --ignore "venv" --ignore ".git" .

      - name: Upload Clean Room Report
        uses: actions/upload-artifact@v4
        with:
          name: local-snippet-report
          path: clean-room-report.json
