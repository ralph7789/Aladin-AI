name: Test Suite

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test-client:
    name: Test Client
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
        
      - name: Build Packages
        run: npm run build:packages
        
      - name: Run Client Tests
        run: npm run test:client

  test-api:
    name: Test API
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
        
      - name: Build Packages
        run: npm run build:packages
        
      - name: Run API Tests
        run: npm run test:api
        env:
          MONGOMS_VERSION: '4.4.29'
